# Disposable RustFS lifecycle and runtime process-death proof. Set
# OBJECT_STORE_COMMAND="server /data" for the MinIO compatibility target.
#
# The caller must resolve every dependency image to an immutable digest before
# starting this stack. No production volume, network, or container is reused.
services:
  objectstore:
    image: ${OBJECT_STORE_IMAGE:?OBJECT_STORE_IMAGE must be an immutable digest reference}
    pull_policy: never
    command: ${OBJECT_STORE_COMMAND:-/data}
    environment:
      MINIO_ROOT_USER: integration-local
      MINIO_ROOT_PASSWORD: integration-local-secret
      RUSTFS_ACCESS_KEY: integration-local
      RUSTFS_SECRET_KEY: integration-local-secret
      RUSTFS_VOLUMES: /data
    volumes:
      - objectstore_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      integration:
        aliases:
          - pdfsearch-objectstore

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable digest reference}
    pull_policy: never
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks:
      - integration

  lifecycle:
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    entrypoint: ["bash", "/app/scripts/ci/run_vault_lifecycle_in_container.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: flowdocs.settings_integration
      PYTHONPATH: /app:/app/flowdocs
      PDFSEARCH_INTEGRATION_ROOT: /app/integration-data
      DATA_CONTROL_ROOT: /app/data-control
      CONTROL_DB_PATH: /app/data-control/control.sqlite3
      VAULT_RESTORE_ROOT: /app/integration-data/restore-quarantine
      RUNTIME_GENERATIONS_ROOT: /app/integration-data/runtime-generations
      APP_ENV: production
      DATASET_ID: ai-sahakar-prod
      AUTHORITATIVE_DATASET_ID: ai-sahakar-prod
      RESTORE_SOURCE_DATASET_ID: ai-sahakar-prod
      PRODUCTION_SOURCE_ID: ai-sahakar-prod
      DEPLOYMENT_ID: vaultops-ci-deployment
      INSTANCE_ID: vaultops-ci-instance
      REPLICA_ID: vaultops-ci-replica
      APP_RELEASE_VERSION: vaultops-ci-release
      APP_IMAGE_DIGEST: sha256:1111111111111111111111111111111111111111111111111111111111111111
      BACKUP_ROLE: writer
      DATA_MODE: local
      EXTERNAL_SIDE_EFFECTS_MODE: enabled
      DATA_BOOTSTRAP_MODE: empty
      ALLOW_INSECURE_DEFAULTS: "1"
      SECRET_KEY: integration-only-secret-key-with-more-than-fifty-characters-not-for-production
      ARTIFACT_VAULT_ENABLED: "1"
      ARTIFACT_VAULT_ENDPOINT: http://pdfsearch-objectstore:9000
      ARTIFACT_VAULT_BUCKET: pdfsearch-test
      ARTIFACT_VAULT_REGION: us-east-1
      ARTIFACT_VAULT_ACCESS_KEY: integration-local
      ARTIFACT_VAULT_SECRET_KEY: integration-local-secret
      VAULT_ALLOWED_S3_ENDPOINTS: http://pdfsearch-objectstore:9000
      VAULT_ALLOW_HTTP_S3_ENDPOINTS: "1"
      VAULT_BLOCK_PRIVATE_S3_ENDPOINTS: "0"
      VAULT_SYNC_ENABLED: "1"
      VAULT_SYNC_MODE: manual
      VAULT_SYNC_PROMOTION_MODE: manual
      VAULT_RESTORE_ENABLED: "1"
      VAULT_RESTORE_REQUIRE_SANITIZATION: "1"
      VAULT_RESTORE_MIN_FREE_BYTES: "0"
      VAULT_RESTORE_MIN_FREE_INODES: "0"
      REDIS_URL: redis://redis:6379/1
      OPENAI_API_KEY: ""
      PDFSEARCH_TEST_EMBEDDINGS: "1"
    volumes:
      - lifecycle_data:/app/integration-data
      - lifecycle_control:/app/data-control
    depends_on:
      objectstore:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - integration

  runtime-cutover:
    profiles: ["process-death"]
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    entrypoint:
      - python
      - /app/scripts/ci/runtime_process_death_probe.py
      - cutover
    environment: &runtime_environment
      DATA_CONTROL_ROOT: /app/data-control
      RUNTIME_GENERATIONS_ROOT: /app/data/runtime-generations
      APP_ENV: staging
      DEPLOYMENT_ID: vaultops-process-death
      STAGING_RUNTIME_ACTIVATION_ENABLED: "1"
      STAGING_ACTIVATION_APPLY_MODE: auto
      ACTIVATION_INTENT_SIGNING_KEY: process-death-signing-key-with-at-least-32-characters
      ACTIVATION_READINESS_TIMEOUT_SECONDS: "10"
    volumes: &runtime_volumes
      - runtime_data:/app/data
      - runtime_control:/app/data-control
    networks:
      - integration

  runtime-recovery:
    profiles: ["process-death"]
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    entrypoint:
      - python
      - /app/scripts/ci/runtime_process_death_probe.py
      - recover
    environment: *runtime_environment
    volumes: *runtime_volumes
    networks:
      - integration

  runtime-verify:
    profiles: ["process-death"]
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    entrypoint:
      - python
      - /app/scripts/ci/runtime_process_death_probe.py
      - verify
    environment: *runtime_environment
    volumes: *runtime_volumes
    networks:
      - integration

volumes:
  objectstore_data:
  lifecycle_data:
  lifecycle_control:
  runtime_data:
  runtime_control:

networks:
  integration:
    driver: bridge
