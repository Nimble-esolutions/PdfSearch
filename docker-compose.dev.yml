services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${DEV_VAULT_ACCESS_KEY:-pdfsearch-dev}
      MINIO_ROOT_PASSWORD: ${DEV_VAULT_SECRET_KEY:-pdfsearch-dev-secret}
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - internal

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set dev http://minio:9000
        "$${DEV_VAULT_ACCESS_KEY}" "$${DEV_VAULT_SECRET_KEY}" &&
        mc mb --ignore-existing dev/"$${DEV_VAULT_BUCKET}"
    environment:
      DEV_VAULT_ACCESS_KEY: ${DEV_VAULT_ACCESS_KEY:-pdfsearch-dev}
      DEV_VAULT_SECRET_KEY: ${DEV_VAULT_SECRET_KEY:-pdfsearch-dev-secret}
      DEV_VAULT_BUCKET: ${DEV_VAULT_BUCKET:-pdfsearch-dev}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - flowdocs_data_dev:/app/data
      - flowdocs_control_dev:/app/data-control
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment: &dev-application-environment
      - DATA_ROOT=/app/data
      - DATA_CONTROL_ROOT=/app/data-control
      - CONTROL_DB_PATH=/app/data-control/control.sqlite3
      - VAULT_RESTORE_ROOT=/app/data/restore-quarantine
      - RUNTIME_GENERATIONS_ROOT=/app/data/runtime-generations
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      - MEDIA_ROOT=/app/data/media
      - PDF_CACHE_DIR=/app/data/pdf_cache
      - STATIC_ROOT=/app/data/staticfiles
      - FAISS_INDEX_DIR=/app/data/faiss_indexes
      - CHROMA_DIR=/app/data/chroma_db
      - BACKUP_DIR=/app/data/backups
      - DATA_BOOTSTRAP_MODE=${DATA_BOOTSTRAP_MODE:-empty}
      - DECLARED_SEED_DB=${DECLARED_SEED_DB:-/app/init/db.sqlite3}
      - DECLARED_SEED_MEDIA=${DECLARED_SEED_MEDIA:-/app/init/media}
      - APP_ENV=${APP_ENV:-development}
      - DEPLOYMENT_ID=${DEPLOYMENT_ID:-local-dev}
      - DATASET_ID=${DATASET_ID:-ai-sahakar-dev}
      - AUTHORITATIVE_DATASET_ID=${AUTHORITATIVE_DATASET_ID:-ai-sahakar-dev}
      - PRODUCTION_SOURCE_ID=${PRODUCTION_SOURCE_ID:-local-dev}
      - DATA_MODE=${DATA_MODE:-empty}
      - BACKUP_ROLE=${BACKUP_ROLE:-disabled}
      - BACKUP_SYNC_MODE=${BACKUP_SYNC_MODE:-manual}
      - VAULT_SYNC_ENABLED=${VAULT_SYNC_ENABLED:-0}
      - VAULT_SYNC_MODE=${VAULT_SYNC_MODE:-manual}
      - VAULT_SYNC_PROMOTION_MODE=${VAULT_SYNC_PROMOTION_MODE:-manual}
      - VAULT_MUTATION_TRACKING_ENABLED=${VAULT_MUTATION_TRACKING_ENABLED:-1}
      - VAULT_SNAPSHOT_ROOT=/app/data-control/snapshots
      - VAULT_SNAPSHOT_CLEANUP_GRACE_SECONDS=${VAULT_SNAPSHOT_CLEANUP_GRACE_SECONDS:-120}
      - VAULT_SNAPSHOT_CLEANUP_MAX_ITEMS=${VAULT_SNAPSHOT_CLEANUP_MAX_ITEMS:-8}
      - VAULT_SNAPSHOT_CLEANUP_MAX_SCAN_ITEMS=${VAULT_SNAPSHOT_CLEANUP_MAX_SCAN_ITEMS:-64}
      - VAULT_SNAPSHOT_CLEANUP_MAX_BYTES=${VAULT_SNAPSHOT_CLEANUP_MAX_BYTES:-536870912}
      - VAULT_SNAPSHOT_CLEANUP_MAX_SECONDS=${VAULT_SNAPSHOT_CLEANUP_MAX_SECONDS:-5}
      - VAULT_SNAPSHOT_FAISS_MAX_PDF_JSON_BYTES=${VAULT_SNAPSHOT_FAISS_MAX_PDF_JSON_BYTES:-134217728}
      - VAULT_DEFAULT_PROFILE=${VAULT_DEFAULT_PROFILE:-local-development}
      - VAULT_RESTORE_ENABLED=${VAULT_RESTORE_ENABLED:-0}
      - VAULT_ADMIN_MUTATIONS_ENABLED=${VAULT_ADMIN_MUTATIONS_ENABLED:-0}
      - LOCAL_INDEX_MAINTENANCE_ENABLED=${LOCAL_INDEX_MAINTENANCE_ENABLED:-1}
      - FORCE_REINDEX_ENABLED=${FORCE_REINDEX_ENABLED:-1}
      - EXTERNAL_EMBEDDINGS_ENABLED=${EXTERNAL_EMBEDDINGS_ENABLED:-1}
      - MAINTENANCE_WORKSPACE_ROOT=/app/data-control/maintenance-workspaces
      - MAINTENANCE_JOB_TIMEOUT_SECONDS=${MAINTENANCE_JOB_TIMEOUT_SECONDS:-7200}
      - MAINTENANCE_WORKER_HEARTBEAT_PATH=/app/data-control/runtime/maintenance-worker.heartbeat
      - MAINTENANCE_WORKER_HEARTBEAT_MAX_AGE_SECONDS=${MAINTENANCE_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-30}
      - VAULT_UI_PROFILE_CONFIGURATION_ENABLED=${VAULT_UI_PROFILE_CONFIGURATION_ENABLED:-1}
      - VAULT_ALLOWED_S3_ENDPOINTS=${VAULT_ALLOWED_S3_ENDPOINTS:-http://minio:9000}
      - VAULT_CREDENTIAL_ALIASES=${VAULT_CREDENTIAL_ALIASES:-}
      - VAULT_BLOCK_PRIVATE_S3_ENDPOINTS=${VAULT_BLOCK_PRIVATE_S3_ENDPOINTS:-0}
      - VAULT_ALLOW_HTTP_S3_ENDPOINTS=${VAULT_ALLOW_HTTP_S3_ENDPOINTS:-1}
      - VAULT_RESTORE_REQUIRE_SANITIZATION=${VAULT_RESTORE_REQUIRE_SANITIZATION:-1}
      - STAGING_RUNTIME_ACTIVATION_ENABLED=${STAGING_RUNTIME_ACTIVATION_ENABLED:-0}
      - MAINTENANCE_CANDIDATE_PREPARATION_ENABLED=${MAINTENANCE_CANDIDATE_PREPARATION_ENABLED:-0}
      - STAGING_ACTIVATION_APPLY_MODE=${STAGING_ACTIVATION_APPLY_MODE:-auto}
      - ACTIVATION_INTENT_SIGNING_KEY=${ACTIVATION_INTENT_SIGNING_KEY:-}
      - ACTIVATION_SMOKE_QUERIES_FILE=${ACTIVATION_SMOKE_QUERIES_FILE:-/app/data-control/config/activation-smoke-queries.json}
      - ACTIVATION_RECOVERY_SUPERADMIN_USERNAME=${ACTIVATION_RECOVERY_SUPERADMIN_USERNAME:-}
      - ACTIVATION_RECOVERY_SUPERADMIN_PASSWORD=${ACTIVATION_RECOVERY_SUPERADMIN_PASSWORD:-}
      - EXTERNAL_SIDE_EFFECTS_MODE=${EXTERNAL_SIDE_EFFECTS_MODE:-sandbox}
      - DEBUG=True
      - ALLOW_INSECURE_DEFAULTS=1
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - ARTIFACT_VAULT_ENABLED=${ARTIFACT_VAULT_ENABLED:-1}
      - ARTIFACT_VAULT_ENDPOINT=${ARTIFACT_VAULT_ENDPOINT:-http://minio:9000}
      - ARTIFACT_VAULT_BUCKET=${ARTIFACT_VAULT_BUCKET:-pdfsearch-dev}
      - ARTIFACT_VAULT_REGION=${ARTIFACT_VAULT_REGION:-us-east-1}
      - ARTIFACT_VAULT_ACCESS_KEY=${ARTIFACT_VAULT_ACCESS_KEY:-pdfsearch-dev}
      - ARTIFACT_VAULT_SECRET_KEY=${ARTIFACT_VAULT_SECRET_KEY:-pdfsearch-dev-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - REDIS_URL=redis://redis:6379/1
      - PDF_CHUNK_SIZE=${PDF_CHUNK_SIZE:-1200}
      - PDF_CHUNK_OVERLAP=${PDF_CHUNK_OVERLAP:-200}
      - MAX_CONTEXT_WORDS=${MAX_CONTEXT_WORDS:-2500}
      - TOP_K_CHUNKS=${TOP_K_CHUNKS:-5}
      - EMBEDDING_TTL=${EMBEDDING_TTL:-604800}
      - SEARCH_CACHE_TTL=${SEARCH_CACHE_TTL:-600}
      - CREATE_SUPERUSER=${CREATE_SUPERUSER:-0}
      - PUBLIC_SEARCH_ENABLED=${PUBLIC_SEARCH_ENABLED:-1}
      - DISPLAY_SERVICE_FOOTER=${DISPLAY_SERVICE_FOOTER:-1}
      - PUBLIC_SEARCH_FOLDER_IDS=${PUBLIC_SEARCH_FOLDER_IDS:-}
      - PUBLIC_SEARCH_MAX_WORDS=${PUBLIC_SEARCH_MAX_WORDS:-30}
      - PUBLIC_SEARCH_RATE_LIMIT=${PUBLIC_SEARCH_RATE_LIMIT:-30}
      - PUBLIC_SEARCH_RATE_WINDOW=${PUBLIC_SEARCH_RATE_WINDOW:-60}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/worker-entrypoint.sh"]
    volumes:
      - flowdocs_data_dev:/app/data
      - flowdocs_control_dev:/app/data-control
    environment: *dev-application-environment
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, pathlib, sys, time;
          path = pathlib.Path(os.environ["MAINTENANCE_WORKER_HEARTBEAT_PATH"]);
          maximum = float(os.environ["MAINTENANCE_WORKER_HEARTBEAT_MAX_AGE_SECONDS"]);
          sys.exit(0 if path.is_file() and time.time() - path.stat().st_mtime <= maximum else 1)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - internal

volumes:
  redis_data_dev:
    driver: local
  flowdocs_data_dev:
    driver: local
  flowdocs_control_dev:
    driver: local
  minio_data_dev:
    driver: local

networks:
  internal:
    driver: bridge
