version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: flowdocs-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowdocs-web-dev
    command: sh -c "./start.sh"
    volumes:
      # PDFs storage - configurable via VOLUME_BASE_PATH
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/pdfs:/app/flowdocs/media/pdfs
      # Database SQLite volume
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/db.sqlite3:/app/flowdocs/db.sqlite3
      # FAISS indexes for vector search
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/faiss_indexes:/app/flowdocs/faiss_indexes
      # Optional: Mount source code for live reloading (uncomment if needed)
      # - ./flowdocs:/app/flowdocs
      # - ./requirements.txt:/app/requirements.txt
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      # Django Settings
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-development}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,dev.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379/1
      
      # CORS and CSRF Settings
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      
      # Database Path (for migrations script)
      - SQLITE_DB_PATH=/app/flowdocs/db.sqlite3
      - MIGRATIONS_JSON=/app/flowdocs/
      - FORCE_MIGRATIONS=0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data_dev:
    driver: local

networks:
  default:
    name: flowdocs-dev-network
