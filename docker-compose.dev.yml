services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - flowdocs_db_dev:/app/flowdocs/db.sqlite3
      - flowdocs_media_dev:/app/flowdocs/media
      - flowdocs_faiss_dev:/app/flowdocs/faiss_indexes
      - flowdocs_chroma_dev:/app/flowdocs/chroma_db
      - flowdocs_static_dev:/app/staticfiles
      - flowdocs_backups_dev:/app/backups
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,dev.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - REDIS_URL=redis://redis:6379/1
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.sqlite3}
      - DB_NAME=${DB_NAME:-/app/flowdocs/db.sqlite3}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/flowdocs/db.sqlite3}
      - MIGRATIONS_JSON=${MIGRATIONS_JSON:-/app/flowdocs/}
      - FORCE_MIGRATIONS=${FORCE_MIGRATIONS:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

volumes:
  redis_data_dev:
    driver: local
  flowdocs_db_dev:
    driver: local
  flowdocs_media_dev:
    driver: local
  flowdocs_faiss_dev:
    driver: local
  flowdocs_chroma_dev:
    driver: local
  flowdocs_static_dev:
    driver: local
  flowdocs_backups_dev:
    driver: local

networks:
  internal:
    driver: bridge
