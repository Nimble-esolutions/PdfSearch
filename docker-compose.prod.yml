version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: flowdocs-redis-prod
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  web:
    image: ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend:latest
    container_name: flowdocs-web-prod
    command: sh -c "./start.sh"
    volumes:
      # PDFs storage - configurable via VOLUME_BASE_PATH
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/pdfs:/app/flowdocs/media/pdfs
      # Database SQLite volume
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/db.sqlite3:/app/flowdocs/db.sqlite3
      # FAISS indexes for vector search
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/faiss_indexes:/app/flowdocs/faiss_indexes
      # Backups directory
      - ${VOLUME_BASE_PATH:-/home/prodsahakar/flowdocs}/backups:/app/backups
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      # Django Settings - Production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-ai-sahakar.net,www.ai-sahakar.net,one.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379/1
      
      # CORS and CSRF Settings
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ai-sahakar.net,https://www.ai-sahakar.net}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://ai-sahakar.net,https://www.ai-sahakar.net,https://one.ai-sahakar.net}
      
      # Database Path (for migrations script)
      - SQLITE_DB_PATH=/app/flowdocs/db.sqlite3
      - MIGRATIONS_JSON=/app/flowdocs/
      - FORCE_MIGRATIONS=0
      
      # Optional: Monitoring
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

volumes:
  redis_data_prod:
    driver: local

networks:
  default:
    name: flowdocs-prod-network
