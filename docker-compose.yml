services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  web:
    image: ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend:latest
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - flowdocs_db:/app/flowdocs/db.sqlite3
      - flowdocs_media:/app/flowdocs/media
      - flowdocs_faiss:/app/flowdocs/faiss_indexes
      - flowdocs_chroma:/app/flowdocs/chroma_db
      - flowdocs_static:/app/staticfiles
      - flowdocs_backups:/app/backups
      - prod_flowdocs:/mnt/legacy:ro
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,dev.ai-sahakar.net,one.ai-sahakar.net,www.ai-sahakar.net,ai-sahakar.net,stagetwo.ai-sahakar.net,stagethree.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ai-sahakar.net,https://dev.ai-sahakar.net,https://one.ai-sahakar.net,https://stagetwo.ai-sahakar.net,https://stagethree.ai-sahakar.net}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://dev.ai-sahakar.net,https://one.ai-sahakar.net,https://mum-01.ai-sahakar.net,http://localhost:8000,http://127.0.0.1:8000,https://ai-sahakar.net,https://www.ai-sahakar.net,https://stagetwo.ai-sahakar.net,https://stagethree.ai-sahakar.net}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.sqlite3}
      - DB_NAME=${DB_NAME:-/app/flowdocs/db.sqlite3}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/flowdocs/db.sqlite3}
      - MIGRATIONS_JSON=${MIGRATIONS_JSON:-/app/flowdocs/}
      - FORCE_MIGRATIONS=${FORCE_MIGRATIONS:-0}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@gmail.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-False}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - dokploy-network

volumes:
  redis_data:
    driver: local
    labels:
      com.dokploy.backup: "true"
  flowdocs_db:
    driver: local
    labels:
      com.dokploy.backup: "true"
  flowdocs_media:
    driver: local
    labels:
      com.dokploy.backup: "true"
  flowdocs_faiss:
    driver: local
    labels:
      com.dokploy.backup: "true"
  flowdocs_chroma:
    driver: local
    labels:
      com.dokploy.backup: "true"
  flowdocs_static:
    driver: local
  flowdocs_backups:
    driver: local
    labels:
      com.dokploy.backup: "true"
  prod_flowdocs:
    external: true

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
