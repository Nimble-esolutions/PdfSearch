services:
  redis:
    image: redis:7-alpine
    container_name: flowdocs-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowdocs-web
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ${DATA_PATH:-/home/prodsahakar/flowdocs}/db.sqlite3:/app/flowdocs/db.sqlite3
      - ${DATA_PATH:-/home/prodsahakar/flowdocs}/media:/app/flowdocs/media
      - ${DATA_PATH:-/home/prodsahakar/flowdocs}/faiss_indexes:/app/flowdocs/faiss_indexes
      - ${DATA_PATH:-/home/prodsahakar/flowdocs}/chroma_db:/app/flowdocs/chroma_db
      - ${DATA_PATH:-/home/prodsahakar/flowdocs}/staticfiles:/app/staticfiles
      - ${DATA_PATH:-/home/prodsahakar/flowdocs}/backups:/app/backups
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-ai-sahakar.net,www.ai-sahakar.net,one.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ai-sahakar.net,https://www.ai-sahakar.net}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://ai-sahakar.net,https://www.ai-sahakar.net,https://one.ai-sahakar.net}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.sqlite3}
      - DB_NAME=${DB_NAME:-db.sqlite3}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/flowdocs/db.sqlite3}
      - MIGRATIONS_JSON=${MIGRATIONS_JSON:-/app/flowdocs/}
      - FORCE_MIGRATIONS=${FORCE_MIGRATIONS:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local
    labels:
      com.dokploy.backup: "true"

networks:
  default:
    name: flowdocs-network
