services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  web:
    image: ${PDFSEARCH_IMAGE:-ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend:latest}
    pull_policy: always
    volumes:
      - flowdocs_data:/app/data
      - prod_flowdocs:/mnt/legacy:ro
    ports:
      # Traefik is the public ingress. Keep the container port off the host's
      # external interfaces so :8000 cannot bypass TLS and proxy controls.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      - DATA_ROOT=/app/data
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      - MEDIA_ROOT=/app/data/media
      - STATIC_ROOT=/app/data/staticfiles
      - FAISS_INDEX_DIR=/app/data/faiss_indexes
      - CHROMA_DIR=/app/data/chroma_db
      - BACKUP_DIR=/app/data/backups
      - LEGACY_DATA_ROOT=/mnt/legacy
      - IMPORT_LEGACY_DATA=${IMPORT_LEGACY_DATA:-0}
      - DATA_BOOTSTRAP_MODE=${DATA_BOOTSTRAP_MODE:-strict}
      - DECLARED_SEED_DB=${DECLARED_SEED_DB:-/app/init/db.sqlite3}
      - DECLARED_SEED_MEDIA=${DECLARED_SEED_MEDIA:-/app/init/media}
      - CREATE_SUPERUSER=${CREATE_SUPERUSER:-0}
      - FIXTURE_BACKUP=${FIXTURE_BACKUP:-0}
      - RUN_JSON_MIGRATIONS=${RUN_JSON_MIGRATIONS:-0}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOW_INSECURE_DEFAULTS=${ALLOW_INSECURE_DEFAULTS:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,ai-sahakar.net,www.ai-sahakar.net,dev.ai-sahakar.net,one.ai-sahakar.net,stagetwo.ai-sahakar.net,stagethree.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ARTIFACT_VAULT_ENABLED=${ARTIFACT_VAULT_ENABLED:-0}
      - ARTIFACT_VAULT_ENDPOINT=${ARTIFACT_VAULT_ENDPOINT:-}
      - ARTIFACT_VAULT_BUCKET=${ARTIFACT_VAULT_BUCKET:-}
      - ARTIFACT_VAULT_REGION=${ARTIFACT_VAULT_REGION:-}
      - ARTIFACT_VAULT_ACCESS_KEY=${ARTIFACT_VAULT_ACCESS_KEY:-}
      - ARTIFACT_VAULT_SECRET_KEY=${ARTIFACT_VAULT_SECRET_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ai-sahakar.net,https://www.ai-sahakar.net}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://ai-sahakar.net,https://www.ai-sahakar.net,http://localhost:8000,http://127.0.0.1:8000}
      # Environment identity
      - APP_ENV=${APP_ENV:-production}
      - DEPLOYMENT_ID=${DEPLOYMENT_ID:-prod-mum-01}
      - DATASET_ID=${DATASET_ID:-ai-sahakar-prod}
      - PRODUCTION_SOURCE_ID=${PRODUCTION_SOURCE_ID:-mum-01}
      - AUTHORITATIVE_DATASET_ID=${AUTHORITATIVE_DATASET_ID:-ai-sahakar-prod}
      - DATA_MODE=${DATA_MODE:-local}
      - BACKUP_ROLE=${BACKUP_ROLE:-disabled}
      - BACKUP_SYNC_MODE=${BACKUP_SYNC_MODE:-manual}
      - EXTERNAL_SIDE_EFFECTS_MODE=${EXTERNAL_SIDE_EFFECTS_MODE:-enabled}
      - APP_IMAGE_DIGEST=${PDFSEARCH_IMAGE:-}
      - APP_RELEASE_VERSION=${APP_RELEASE_VERSION:-}
      - NONPROD_DATA_POLICY=${NONPROD_DATA_POLICY:-}
      # Redis is part of this stack. Keep the service DNS name authoritative;
      # a Dokploy .env value such as localhost points back to the web container.
      - REDIS_URL=redis://redis:6379/1
      - PUBLIC_SEARCH_ENABLED=${PUBLIC_SEARCH_ENABLED:-1}
      - DISPLAY_SERVICE_FOOTER=${DISPLAY_SERVICE_FOOTER:-0}
      - PUBLIC_SEARCH_FOLDER_IDS=${PUBLIC_SEARCH_FOLDER_IDS:-}
      - PUBLIC_SEARCH_MAX_WORDS=${PUBLIC_SEARCH_MAX_WORDS:-30}
      - PUBLIC_SEARCH_RATE_LIMIT=${PUBLIC_SEARCH_RATE_LIMIT:-30}
      - PUBLIC_SEARCH_RATE_WINDOW=${PUBLIC_SEARCH_RATE_WINDOW:-60}
      - PDF_CHUNK_SIZE=${PDF_CHUNK_SIZE:-1200}
      - PDF_CHUNK_OVERLAP=${PDF_CHUNK_OVERLAP:-200}
      - MAX_CONTEXT_WORDS=${MAX_CONTEXT_WORDS:-2500}
      - TOP_K_CHUNKS=${TOP_K_CHUNKS:-5}
      - EMBEDDING_TTL=${EMBEDDING_TTL:-604800}
      - SEARCH_CACHE_TTL=${SEARCH_CACHE_TTL:-600}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-50}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - dokploy-network

  maintenance:
    image: ${PDFSEARCH_IMAGE:-ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend:latest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    entrypoint: ["./worker-entrypoint.sh"]
    volumes:
      - flowdocs_data:/app/data
      - prod_flowdocs:/mnt/legacy:ro
    environment:
      DATA_ROOT: /app/data
      SQLITE_DB_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/data/media
      FAISS_INDEX_DIR: /app/data/faiss_indexes
      CHROMA_DIR: /app/data/chroma_db
      BACKUP_DIR: /app/data/backups
      DJANGO_SETTINGS_MODULE: flowdocs.settings
      REDIS_URL: redis://redis:6379/1
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-0}
      APP_ENV: production
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-prod-mum-01}
      DATASET_ID: ${DATASET_ID:-ai-sahakar-prod}
      PRODUCTION_SOURCE_ID: ${PRODUCTION_SOURCE_ID:-mum-01}
      AUTHORITATIVE_DATASET_ID: ${AUTHORITATIVE_DATASET_ID:-ai-sahakar-prod}
      BACKUP_ROLE: ${BACKUP_ROLE:-disabled}
      EXTERNAL_SIDE_EFFECTS_MODE: ${EXTERNAL_SIDE_EFFECTS_MODE:-enabled}
      DATA_MODE: ${DATA_MODE:-local}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(head -1 /tmp/worker_heartbeat 2>/dev/null) 2>/dev/null && test $$(( $$(date +%s) - $$(tail -1 /tmp/worker_heartbeat 2>/dev/null || echo 0) )) -lt 60 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  redis_data:
    driver: local
    labels:
      com.dokploy.backup: "true"
  flowdocs_data:
    driver: local
    labels:
      com.dokploy.backup: "true"
  prod_flowdocs:
    external: true

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
