services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  web:
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be an immutable repo@sha256 digest}
    pull_policy: always
    volumes:
      - flowdocs_data:/app/data
      - flowdocs_control:/app/data-control
      - prod_flowdocs:/mnt/legacy:ro
    ports:
      # Traefik is the public ingress. Keep the container port off the host's
      # external interfaces so :8000 cannot bypass TLS and proxy controls.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      - DATA_ROOT=/app/data
      - DATA_CONTROL_ROOT=/app/data-control
      - CONTROL_DB_PATH=/app/data-control/control.sqlite3
      - VAULT_RESTORE_ROOT=/app/data/restore-quarantine
      - RUNTIME_GENERATIONS_ROOT=/app/data/runtime-generations
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      - MEDIA_ROOT=/app/data/media
      - PDF_CACHE_DIR=/app/data/pdf_cache
      - STATIC_ROOT=/app/data/staticfiles
      - FAISS_INDEX_DIR=/app/data/faiss_indexes
      - CHROMA_DIR=/app/data/chroma_db
      - BACKUP_DIR=/app/data/backups
      - LEGACY_DATA_ROOT=/mnt/legacy
      - IMPORT_LEGACY_DATA=${IMPORT_LEGACY_DATA:-0}
      - DATA_BOOTSTRAP_MODE=${DATA_BOOTSTRAP_MODE:-strict}
      - DECLARED_SEED_DB=${DECLARED_SEED_DB:-/app/init/db.sqlite3}
      - DECLARED_SEED_MEDIA=${DECLARED_SEED_MEDIA:-/app/init/media}
      - CREATE_SUPERUSER=${CREATE_SUPERUSER:-0}
      - FIXTURE_BACKUP=${FIXTURE_BACKUP:-0}
      - RUN_JSON_MIGRATIONS=${RUN_JSON_MIGRATIONS:-0}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOW_INSECURE_DEFAULTS=${ALLOW_INSECURE_DEFAULTS:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,ai-sahakar.net,www.ai-sahakar.net,dev.ai-sahakar.net,one.ai-sahakar.net,stagetwo.ai-sahakar.net,stagethree.ai-sahakar.net}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-flowdocs.settings}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ARTIFACT_VAULT_ENABLED=${ARTIFACT_VAULT_ENABLED:-0}
      - ARTIFACT_VAULT_ENDPOINT=${ARTIFACT_VAULT_ENDPOINT:-}
      - ARTIFACT_VAULT_BUCKET=${ARTIFACT_VAULT_BUCKET:-}
