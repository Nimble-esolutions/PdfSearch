version: "3.9"

services:
  web:
    build: .
    container_name: flowdocs_web
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/flowdocs/media/pdfs        #updated
      - db_volume:/app/flowdocs             # ✅ correct folder (outer)
    env_file:
      - .env
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  db_volume:

