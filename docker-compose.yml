version: "3.9"

services:
  web:
    build: .
    container_name: flowdocs_web
    ports:
      - "8000:8000"
    volumes:
      - static_vol:/app/staticfiles
      - media_vol:/app/flowdocs/media/pdfs        #updated
     
    env_file:
      - .env
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:


