      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - dokploy-network

  maintenance:
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be an immutable repo@sha256 digest}
    pull_policy: always
    env_file:
      - path: .env
        required: false
    entrypoint: ["./worker-entrypoint.sh"]
    volumes:
      - flowdocs_data:/app/data
      - flowdocs_control:/app/data-control
      - prod_flowdocs:/mnt/legacy:ro
    environment:
      DATA_ROOT: /app/data
      DATA_CONTROL_ROOT: /app/data-control
      CONTROL_DB_PATH: /app/data-control/control.sqlite3
      VAULT_RESTORE_ROOT: /app/data/restore-quarantine
