name: Build Docker Image

on:
  push:
    branches:
      - dev
      - "feature/**" # Optional: Test builds on feature branches
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "flowdocs/**"
      - "start.sh"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
      - "init/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/nimble-esolutions/pdfsearch/shakar-frontend:buildcache,mode=max
          platforms: linux/amd64
