name: Documentation Contract

on:
  pull_request:
    branches:
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'test/**'
      - 'chore/**'
    paths:
      - docs/**
      - plans/**
      - AGENTS.md
      - .github/pull_request_template.md
      - .github/workflows/docs-contract.yml
      - scripts/ci/docs_contract.py
      - scripts/ci/test_docs_contract.py
      - scripts/ci/test_operator_language.py
      - scripts/ci/validate_operator_language.py
  push:
    branches: [dev]
    paths:
      - docs/**
      - plans/**
      - AGENTS.md
      - .github/pull_request_template.md
      - .github/workflows/docs-contract.yml
      - scripts/ci/docs_contract.py
      - scripts/ci/test_docs_contract.py
      - scripts/ci/test_operator_language.py
      - scripts/ci/validate_operator_language.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation and operator language
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)

      - name: Install documentation validation tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          echo "PUPPETEER_EXECUTABLE_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Validate documentation contracts
        run: |
          python3 -m unittest scripts.ci.test_docs_contract
          python3 scripts/ci/docs_contract.py
          python3 -m unittest scripts.ci.test_operator_language
          python3 scripts/ci/validate_operator_language.py
