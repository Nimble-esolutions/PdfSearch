name: Mirror Redis Image to GHCR

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    # Run weekly to keep Redis image updated
    - cron: '0 0 * * 0'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mirror-redis.yml'

jobs:
  mirror-redis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Redis image from Docker Hub
        run: |
          docker pull redis:7-alpine

      - name: Tag Redis image for GHCR
        run: |
          docker tag redis:7-alpine ghcr.io/nimble-esolutions/pdfsearch/redis:7-alpine
          docker tag redis:7-alpine ghcr.io/nimble-esolutions/pdfsearch/redis:latest

      - name: Push Redis image to GHCR
        run: |
          docker push ghcr.io/nimble-esolutions/pdfsearch/redis:7-alpine
          docker push ghcr.io/nimble-esolutions/pdfsearch/redis:latest

