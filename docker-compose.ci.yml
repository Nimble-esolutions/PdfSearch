# CI-only disposable stack. The workflow resolves REDIS_IMAGE to a digest before
# starting this file and never uses the production external volumes or network.
services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable digest reference}
    pull_policy: never
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - ci

  web:
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    volumes:
      - ci_data:/app/data
      - ci_control:/app/data-control
      # Prevent image-bundled init artifacts from entering the fixture run.
      - ./scripts/ci/empty-init:/app/init:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-18000}:8000"
    environment:
      DATA_ROOT: /app/data
      DATA_CONTROL_ROOT: /app/data-control
      CONTROL_DB_PATH: /app/data-control/control.sqlite3
      VAULT_RESTORE_ROOT: /app/data/restore-quarantine
      RUNTIME_GENERATIONS_ROOT: /app/data/runtime-generations
      SQLITE_DB_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/data/media
      PDF_CACHE_DIR: /app/data/pdf_cache
      STATIC_ROOT: /app/data/staticfiles
      FAISS_INDEX_DIR: /app/data/faiss_indexes
      CHROMA_DIR: /app/data/chroma_db
      BACKUP_DIR: /app/data/backups
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided}
      ALLOW_INSECURE_DEFAULTS: "1"
      APP_ENV: development
      DATA_BOOTSTRAP_MODE: empty
      DATA_MODE: local
      # Writer-specific env vars (PRODUCTION_SOURCE_ID, AUTHORITATIVE_DATASET_ID) are
      # intentionally omitted because BACKUP_ROLE=disabled in CI. These are only
      # required when BACKUP_ROLE=writer. A separate CI profile with mock S3 should
      # be created for end-to-end writer-mode testing (see docker-compose.integration.yml).
      BACKUP_ROLE: disabled
      VAULT_SYNC_ENABLED: "0"
      VAULT_SYNC_MODE: manual
      VAULT_SYNC_PROMOTION_MODE: manual
      VAULT_SNAPSHOT_ROOT: /app/data-control/snapshots
      VAULT_RESTORE_ENABLED: "0"
      VAULT_ADMIN_MUTATIONS_ENABLED: "0"
      LOCAL_INDEX_MAINTENANCE_ENABLED: "1"
      FORCE_REINDEX_ENABLED: "1"
      EXTERNAL_EMBEDDINGS_ENABLED: "1"
      MAINTENANCE_WORKSPACE_ROOT: /app/data-control/maintenance-workspaces
      MAINTENANCE_JOB_TIMEOUT_SECONDS: "7200"
      VAULT_ALLOWED_S3_ENDPOINTS: ""
      VAULT_RESTORE_REQUIRE_SANITIZATION: "1"
      STAGING_RUNTIME_ACTIVATION_ENABLED: "0"
      MAINTENANCE_CANDIDATE_PREPARATION_ENABLED: "0"
      EXTERNAL_SIDE_EFFECTS_MODE: sandbox
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: flowdocs.settings
      OPENAI_API_KEY: ""
      GOOGLE_API_KEY: ""
      PDFSEARCH_TEST_EMBEDDINGS: "1"
      ARTIFACT_VAULT_ENABLED: "0"
      REDIS_URL: redis://redis:6379/1
      MAX_FILE_SIZE_MB: "10"
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-18000}
      CSRF_TRUSTED_ORIGINS: http://localhost:${WEB_PORT:-18000},http://127.0.0.1:${WEB_PORT:-18000}
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SECURE: "False"
      SECURE_SSL_REDIRECT: "False"
      GUNICORN_WORKERS: "1"
      GUNICORN_MAX_REQUESTS: "100"
      GUNICORN_MAX_REQUESTS_JITTER: "0"
      GUNICORN_TIMEOUT: "30"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/livez"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    networks:
      - ci

  # This service deliberately does not mount empty-init. It reads the image's
  # real declared /app/init seed using only disposable media placeholders.
  seed:
    profiles: ["seed"]
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    entrypoint: ["python", "/app/scripts/ci/seed_smoke.py"]
    environment:
      DATA_BOOTSTRAP_MODE: strict
      DECLARED_SEED_DB: /app/init/db.sqlite3
    networks:
      - ci

volumes:
  ci_data:
  ci_control:

networks:
  ci:
    driver: bridge
