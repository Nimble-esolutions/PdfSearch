# CI-only disposable stack. The workflow resolves REDIS_IMAGE to a digest before
# starting this file and never uses the production external volumes or network.
services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable digest reference}
    pull_policy: never
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - ci

  web:
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    volumes:
      - ci_data:/app/data
      # Prevent image-bundled init artifacts from entering the fixture run.
      - ./scripts/ci/empty-init:/app/init:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-18000}:8000"
    environment:
      DATA_ROOT: /app/data
      SQLITE_DB_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/data/media
      STATIC_ROOT: /app/data/staticfiles
      FAISS_INDEX_DIR: /app/data/faiss_indexes
      CHROMA_DIR: /app/data/chroma_db
      BACKUP_DIR: /app/data/backups
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided}
      ALLOW_INSECURE_DEFAULTS: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: flowdocs.settings
      OPENAI_API_KEY: ""
      GOOGLE_API_KEY: ""
      PDFSEARCH_TEST_EMBEDDINGS: "1"
      ARTIFACT_VAULT_ENABLED: "0"
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-18000}
      CSRF_TRUSTED_ORIGINS: http://localhost:${WEB_PORT:-18000},http://127.0.0.1:${WEB_PORT:-18000}
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SECURE: "False"
      SECURE_SSL_REDIRECT: "False"
      GUNICORN_WORKERS: "1"
      GUNICORN_MAX_REQUESTS: "100"
      GUNICORN_MAX_REQUESTS_JITTER: "0"
      GUNICORN_TIMEOUT: "30"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    networks:
      - ci

  # This service deliberately does not mount empty-init. It reads the image's
  # real declared /app/init seed using only disposable media placeholders.
  seed:
    profiles: ["seed"]
    image: ${PDFSEARCH_IMAGE:?PDFSEARCH_IMAGE must be provided}
    pull_policy: never
    entrypoint: ["python", "/app/scripts/ci/seed_smoke.py"]
    environment:
      DATA_BOOTSTRAP_MODE: strict
      DECLARED_SEED_DB: /app/init/db.sqlite3
    networks:
      - ci

volumes:
  ci_data:

networks:
  ci:
    driver: bridge
