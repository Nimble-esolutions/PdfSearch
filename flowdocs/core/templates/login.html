{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Login - CC & RCS Maharashtra" %}{% endblock %}

{% block content %}
<section class="admin-panel admin-panel--narrow">
  <div class="admin-page-heading text-center">
    <h2>{% trans "Login" %}</h2>
    <p>{% trans "Sign in to manage documents, users, and categories." %}</p>
  </div>

  <form method="post" action="{% url 'login' %}" class="admin-form">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">{% trans "Username" %}</label>
      <input type="text" name="username" autofocus required id="id_username"
             class="form-control" placeholder="{% trans 'Enter username' %}">
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">{% trans "Password" %}</label>
      <div class="input-group">
        <input type="password" name="password" required id="id_password"
               class="form-control" placeholder="{% trans 'Enter password' %}">
        <button type="button"
                id="togglePassword"
                class="btn btn-outline-secondary"
                aria-controls="id_password"
                aria-pressed="false">
          {% trans "Show" %}
        </button>
      </div>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary w-100">{% trans "Login" %}</button>
  </form>
</section>
{% endblock %}

{% block extra_js %}
<script>
const togglePassword = document.querySelector('#togglePassword');
const passwordInput = document.querySelector('#id_password');

if (togglePassword && passwordInput) {
  togglePassword.addEventListener('click', function () {
    const isHidden = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isHidden ? 'text' : 'password');
    this.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
    this.textContent = isHidden ? "{% trans 'Hide' %}" : "{% trans 'Show' %}";
  });
}
</script>
{% endblock %}
