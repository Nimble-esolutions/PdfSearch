{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE }}">
<head>
  <meta charset="UTF-8">
  <title>{% trans "Search With AI - CC & RCS Maharashtra" %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% trans 'Commissioner for Co-operation and Registrar, Cooperative Societies, Maharashtra State, Pune' %}">
  
  <!-- Faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&display=block" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>

<!-- Top Utility Bar -->
<div class="bg-dark text-white small px-3 py-1">
  <div class="container d-flex justify-content-end align-items-center">
    <div class="text-start">
    
      <a href="https://sahakarayukta.maharashtra.gov.in/Site/Home/Index.aspx" class="text-white text-decoration-none me-2" style="display: none;">{% trans "Home" %}</a> 
      <a href="https://www.google.com/maps/d/u/4/viewer?mid=1nGBPe3fJCLDL0tsUEluGKT6RVTljhiw&ll=18.848903177273304%2C76.7698375&z=6" class="text-white text-decoration-none me-2" style="display: none;">{% trans "Locate Us" %}</a> 
      
      <form action="{% url 'set_language' %}" method="post" class="d-inline" >
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">
        {% if request.LANGUAGE_CODE == 'en' %}
          <input type="hidden" name="language" value="mr">
          <button type="submit" class="btn btn-link btn-sm text-white p-0 m-0" style="display: none;">मराठी</button>
        {% else %}
          <input type="hidden" name="language" value="en">
          <button type="submit" class="btn btn-link btn-sm text-white p-0 m-0" style="display: none;">English</button>
        {% endif %}
      </form>
    </div>
  </div>
</div>

<header class="banner-header">
    <div class="text-start" style="margin-left: 3%;">
        <a href="/login/" class="text-black text-decoration-none me-2">Admin Login</a>
    </div>
  <picture>
    <source media="(max-width: 768px)" srcset="{% static 'main/images/banner-opt-2-wotxt.png' %}">
    <img src="{% static 'main/images/banner-opt-2-wotxt.png' %}" alt="Banner" class="banner-img">
  </picture>
  <div class="banner-text">
    <!-- <h5>{% trans "AI Enabled Search" %}</h5> -->
    <!-- <h6>{% trans "Registrar Co-operative Societies" %}</h6> -->
  </div>
</header>

<!-- Chat Section -->
<div class="container-fluid p-0">
  <div class="chat-container">
      <div id="chatMain"></div>

      <div class="chat-input">
         <img src="{% static 'main/images/Option-1 BOT.png' %}" alt="Ask Icon" style="height:50px;">
         <select id="subject">
            <option value="housing">Act</option>
            <option value="generic">General</option>
        </select>

          <input type="text" id="userQuery" placeholder="💬 {% trans 'How can I assist you today?' %}">
          <button id="sendBtn">{% trans "Search" %}</button>

          <!-- WhatsApp & Feedback -->
          <a href="https://wa.me/919421200000" target="_blank" class="whatsapp-link" style="display: none;">
            <picture>
              <source media="(max-width: 768px)" srcset="{% static 'main/images/wh-btn-mobile.jpg' %}">
              <img src="{% static 'main/images/wh-btn.jpg' %}" alt="WhatsApp" style="height:40px; cursor:pointer;">
            </picture>
          </a>

          <a href="https://docs.google.com/forms/d/e/1FAIpQLSecBg9pBb4Z_HDwK06-DnibIxltK2Bzo5gMpSO63hAQPM8hnA/viewform" target="_blank" class="feedback-link" style="display: none;">
            <picture>
              <source media="(max-width: 768px)" srcset="{% static 'main/images/fd-btn-mobile.jpg' %}">
              <img src="{% static 'main/images/fd-btn.jpg' %}" alt="Feedback" style="height:40px; cursor:pointer;">
            </picture>
          </a>
      </div>

      <small id="wordCounter" style="color: gray; font-size: 12px; display: block; margin-left: 10px; margin-top: 2px;">
        0/30 words
      </small>

      
  </div>
</div>

<!-- Footer -->
<footer class="bg-light py-2  border-top">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <small>{% trans " All rights reserved© nimble-esolutions." %}</small>
      </div>
      <div class="text-center" style="font-size: 13px; color: #666;">
         ** AI can make mistakes. 
      </div>
      <div class="d-flex gap-3">
        <a href="https://nimble-esolutions.com/" target="_blank"><img src="{% static 'main/images/Nimble_red-logo.png' %}" alt="Logo 4" height="40"></a>
      </div>
    </div>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const chatMain = document.getElementById('chatMain');
const sendBtn = document.getElementById('sendBtn');
const userQuery = document.getElementById('userQuery');
const subjectSelect = document.getElementById('subject');

// Show welcome message
window.addEventListener("DOMContentLoaded", function(){
    const welcome = `{{ welcome_message|safe }}`;
    if(welcome) appendMessage(welcome, "gpt");
});

sendBtn.addEventListener('click', sendMessage);
userQuery.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });

function sendMessage(){
    const query = userQuery.value.trim();
    if(!query) return;

    const wordCount = query.split(/\s+/).length;
    if(wordCount > 30){
        appendMessage("⚠️ Your query is too long (max 30 words). Please shorten it.", "gpt");
        return;
    }

    const subject = subjectSelect.value || "generic";

    appendMessage(query, 'user');
    userQuery.value = '';
    sendBtn.disabled = true;

    // Typing indicator
    const typingDiv = appendMessage('', 'gpt', true);
    typingDiv.classList.add('typing');

    const stages = [" Searching", " Analyzing", " Composing"];
    let stageIndex = 0;
    function showStage() {
        typingDiv.innerHTML = `<strong>${stages[stageIndex]}</strong> <span>•</span><span>•</span><span>•</span>`;
        stageIndex++;
        if(stageIndex < stages.length) setTimeout(showStage, 2000);
    }
    showStage();

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch("{% url 'search' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question: query,
            subject: subject
        }),
        credentials: "same-origin"
    })
    .then(res => res.json())
    .then(data => {
        typingDiv.remove();
        sendBtn.disabled = false;

        console.log("AI Response:", data);

        /* ==================================================
           🔑 CRITICAL FIX: normalize answer to STRING
           ================================================== */
        let answerText = "";

        if (typeof data.answer === "string") {
            answerText = data.answer;
        } else if (typeof data.answer === "object" && data.answer !== null) {
            answerText = data.answer.answer || "";
        }

        if (answerText) {
            typeEffect(answerText, data.references || []);
        } else if (data.error) {
            appendMessage("⚠️ Error: " + data.error, "gpt");
        } else {
            appendMessage("⚠️ No answer generated. Please try again.", "gpt");
        }
    })
    .catch(err => {
        typingDiv.remove();
        sendBtn.disabled = false;
        console.error(err);
        appendMessage("⚠️ Something went wrong. Please try again later.", "gpt");
    });
}

function sendMessageOLD(){
    const query = userQuery.value.trim();
    if(!query) return;

    const wordCount = query.split(/\s+/).length;
    if(wordCount > 30){
        appendMessage("⚠️ Your query is too long (max 30 words). Please shorten it.", "gpt");
        return;
    }

    const subject = subjectSelect.value || "generic";

    appendMessage(query, 'user');
    userQuery.value = '';
    sendBtn.disabled = true;

    const typingDiv = appendMessage('', 'gpt', true);
    typingDiv.classList.add('typing');
    const stages = [" Searching", " Analyzing", " Composing"];
    let stageIndex = 0;
    function showStage() {
        typingDiv.innerHTML = `<strong>${stages[stageIndex]}</strong> <span>•</span><span>•</span><span>•</span>`;
        stageIndex++;
        if(stageIndex < stages.length) setTimeout(showStage, 2000);
    }
    showStage();

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    fetch("{% url 'search' %}", {
        method: "POST",
        headers: {
            'X-CSRFToken': csrfToken,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({question: query, subject: subject}),
        credentials: "same-origin"
    })
    .then(res => res.json())
    .then(data => {
        typingDiv.remove();
        sendBtn.disabled = false;
        if(data.answer){
            typeEffect(data.answer, data.references || []);
        } else if(data.error){
            appendMessage('⚠️ Error: ' + data.error, 'gpt');
        }
    })
    .catch(err => {
        typingDiv.remove();
        sendBtn.disabled = false;
        appendMessage('⚠️ Something went wrong. Please try again later.', 'gpt');
        console.error(err);
    });
}

function appendMessage(text, sender, isLoading=false){
    const div = document.createElement('div');
    div.className = sender === 'user' ? 'user-msg' : 'gpt-msg';
    if(isLoading){
        div.textContent = text;
    } else {
        text.split("\n").forEach((line, idx) => {
            if(idx>0) div.appendChild(document.createElement("br"));
            div.appendChild(document.createTextNode(line));
        });
    }
    chatMain.appendChild(div);
    chatMain.scrollTop = chatMain.scrollHeight;
    if(isLoading) return div;
    return div;
}

function typeEffect(text, references=[]){
    const div = document.createElement('div');
    div.className = 'gpt-msg';
    chatMain.appendChild(div);

    let cursor = document.createElement("span");
    cursor.className = "cursor";
    div.appendChild(cursor);

    const segmenter = new Intl.Segmenter('mr', { granularity: 'grapheme' });
    const graphemes = [...segmenter.segment(text)].map(seg => seg.segment);

    let i = 0;
    function typing() {
        if(i < graphemes.length){
            cursor.insertAdjacentHTML("beforebegin", graphemes[i]==="\n"? "<br>": graphemes[i]);
            chatMain.scrollTop = chatMain.scrollHeight;
            i++;
            setTimeout(typing, 20);
        } else {
            cursor.remove();
            if(references.length>0){
                const refDiv = document.createElement('div');
                refDiv.className = "references";
                refDiv.innerHTML = "<strong>📚 References:</strong>";
                references.forEach(ref=>{
                    const card = document.createElement('div');
                    card.className = "ref-card";
                    card.innerHTML = `
                        <a href="${ref.url}" target="_blank">${ref.title}</a>
                        <small>${ref.folder} • ${ref.uploaded_at}</small>
                    `;
                    refDiv.appendChild(card);
                });
                div.appendChild(refDiv);
            }
        }
    }
    typing();
}

const wordCounter = document.getElementById("wordCounter");
userQuery.addEventListener("input", function(){
    const words = this.value.trim().split(/\s+/).filter(w => w.length>0);
    const count = words.length;
    wordCounter.textContent = `${count}/30 words`;
    wordCounter.style.color = count>30? "red":"gray";
    sendBtn.disabled = (count>30 || count===0);
});
</script>

<!-- Your CSS stays unchanged -->
<style>

body, input, button, .gpt-msg, .user-msg, 
.banner-text, .chat-input input, .chat-input button {
    font-family: 'Noto Sans Devanagari', 'Mangal', 'Kohinoor Devanagari', 
                 'Lohit Devanagari', 'Segoe UI', sans-serif !important;
    font-size: 16px;  /* Safari sometimes scales weird, this stabilizes */
    line-height: 1.5;
}

html {
    font-family: 'Noto Sans Devanagari', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}
.bg-dark {
    background-color: #ffffff !important;
}
.chat-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 80vh;
    padding: 15px;
    background: #fff;
}
#chatMain {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 5px;
}
.user-msg {
    align-self: flex-end;
    background-color:#f7eee2;
    color: #000;
    padding: 10px 15px;
    border-radius: 20px 20px 0 20px;
    max-width: 70%;
    word-wrap: break-word;
}
.gpt-msg {
    align-self: flex-start;
    background-color: #fff;
    padding: 10px 15px;
    border-radius: 20px 20px 20px 0;
    max-width: 100%;
    word-wrap: break-word;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    white-space: normal;
    
}
.typing span {
    display: inline-block;
    animation: blink 1.2s infinite;
}
@keyframes blink {
    0%, 20% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
}
.cursor {
    display: inline-block;
    width: 2px;
    background: black;
    margin-left: 2px;
    animation: blink 1s infinite;
}

/* Chat Input */
.chat-input {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 10px;
}
.chat-input input[type="text"] {
    flex: 1;
    border-radius: 10px;
    padding: 8px 8px;
    border: 1px solid #ccc;
    box-shadow: 2px 2px 2px 2px #ccc;
}
.chat-input select {
    border-radius: 10px;
    padding: 8px 8px;
    border: 1px solid #ccc;
    box-shadow: 2px 2px 2px 2px #ccc;
}
.chat-input button {
    border-radius: 10px;
    padding: 8px 8px;
    /*background-color: #e97e15;*/
    background-color: #3F51B5;
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 2px 2px 2px 2px #ccc;
}
.chat-input button:hover {
    background-color: #3F51B5;
}

/* References */
.references {
    font-size: 0.85rem;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.ref-card {
    background: #f1f8e9;
    border-left: 4px solid #8bc34a;
    padding: 6px 10px;
    border-radius: 8px;
}
.ref-card a {
    color: #33691e;
    text-decoration: none;
    font-weight: 600;
}
.ref-card small {
    display: block;
    font-size: 0.75rem;
    color: #666;
}

/* Banner */
.banner-header {
    position: relative;
    width: 100%;
    overflow: hidden;
}
.banner-img {
    width: 100%;
    height: auto;
    display: block;
}
.banner-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #000;
    z-index: 2;
    padding: 0 10px;
    width: 100%;
    max-width: 90%;
}
.banner-text h5 {
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 1.5rem;
}
.banner-text h6 {
    font-weight: bold;
    font-size: 1rem;
}

/* Mobile adjustments */
@media (max-width: 768px) {
    /* Banner smaller */
    .banner-text h5 { font-size: 1rem; }
    .banner-text h6 { font-size: 0.7rem; }

    /* Center heading */
    .banner-text { top: 50%; }
 
    /* Chat Input - hide BOT image */
    .chat-input img[alt="Ask Icon"] { display: none !important; }

    /* Input & buttons inline */
    .chat-input { gap: 3px; padding-right: 5px; }

    /* Make icons smaller on mobile */
    .chat-input a.whatsapp-link img,
    .chat-input a.feedback-link img {
        height: 10px;
        width: auto;
    }

    /* Make icons visible inline */
    /* .chat-input a { display: inline-flex !important; align-items: center; } */

    /* Optional small adjustment for last icon spacing */
    .chat-input a:last-child { margin-right: 0; }

    .whatsapp-link,
    .feedback-link {
        display: none !important;
    }
}

</style>

</body>
</html>
